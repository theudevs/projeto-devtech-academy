<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Aluno</title>
</head>
<body>
    <h1>Formulário Aluno</h1> <hr>

    <form id="form-aluno">
        <label for="nome"> Nome:</label><br>
        <input type="text" id="nome" required placeholder="digite seu nome"> <br>

        <label for="idade">Idade:</label> <br>
        <input type="number" id="idade" required placeholder="digite sua idade"> <br>

        <label for="curso">Curso:</label> <br>
        <select id="curso"> 
            <option>JavaScript</option>
            <option>Python</option>
            <option>Java</option>
        </select> <br>
        
        <label for="nota">Nota:</label> <br>
        <input type="number" id="nota" step="0.1" required placeholder="Digite sua nota"> <br> 
        <br>

        <button type="submit" id="btn-salvar">Cadastrar</button> <br>
        <p id="mensagem" style="color:red;"></p>

        <br>

        <table border=".2" cellpadding="8" cellspacing="0">
            <thead bgcolor="gray" >
                <tr>
                    <th width="130">Nome</th>
                    <th width="130">Idade</th>
                    <th width="130">Curso</th>
                    <th width="130">Nota</th>
                    <th width="130">Situação</th>
                    <th width="130">Ações</th>
                </tr>
            </thead>
            <tbody id="tbody-alunos" >
                
            </tbody>
        </table> <br>
    </form>

    <hr>

    <h2>Relatórios</h2>
    <p id="relatorios">
        <button id="btn-aprovados">Aprovados</button>
        <button id="btn-media-notas">Média das Notas</button>
        <button id="btn-media-idades">Média das Idades</button>
        <button id="btn-alfabetico">Ordem Alfabética</button>
        <button id="btn-por-curso">Alunos por Curso</button>

        <p id="tipo-relatorio" aria-setsize="3"></p>
        <pre id="saida-relatorio" style="background:#f5f5f5; padding:8px"></pre>
    </p>

  <script src="./script.js"></script>
</body>
</html>
